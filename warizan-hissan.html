<title>わり算の筆算道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">

<style>
:root{
  --paper:#FBFAF5;
  --panel:#FFFFFF;
  --grid:#DCE4E3;
  --ink:#2A3134;
  --ink-2:#707A7D;
  --line:#C6CFD1;
  --red:#CE3F2C;
  --red-soft:#F7E3DE;
  --blue:#1C6DA8;
  --blue-soft:#E3EEF6;
  --shadow:0 1px 2px rgba(42,49,52,.07), 0 6px 20px rgba(42,49,52,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D2925;
    --panel:#25332E;
    --grid:#2F403A;
    --ink:#ECF1EA;
    --ink-2:#9DAEA6;
    --line:#3D4F48;
    --red:#F1866F;
    --red-soft:#3B2A27;
    --blue:#7DC3E7;
    --blue-soft:#1E3038;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#1D2925;
  --panel:#25332E;
  --grid:#2F403A;
  --ink:#ECF1EA;
  --ink-2:#9DAEA6;
  --line:#3D4F48;
  --red:#F1866F;
  --red-soft:#3B2A27;
  --blue:#7DC3E7;
  --blue-soft:#1E3038;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}

.app{
  max-width:540px;
  margin:0 auto;
  padding:16px 16px 22px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ---------- ヘッダー ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.title{font-size:19px;font-weight:700;letter-spacing:.02em;margin:0}
.count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.linkbtn{
  background:none;border:none;padding:4px 2px;margin:0;
  font:inherit;font-size:13px;color:var(--blue);cursor:pointer;
  border-bottom:1px solid transparent;
}
.linkbtn:hover{border-bottom-color:var(--blue)}
.linkbtn:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

/* ---------- もんだいの種類 ---------- */
.setbtn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;
  padding:9px 13px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;
  transition:border-color .15s;
}
.setbtn:hover{border-color:var(--ink-2)}
.setbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.setbtn .caret{color:var(--ink-2);font-size:11px}
.segs{display:flex;gap:6px;margin-bottom:16px}
.mode{
  flex:1;
  padding:7px 4px;
  border-radius:9px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--ink-2);
  font-family:inherit;font-size:12.5px;font-weight:500;
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.mode[aria-pressed="true"]{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper);
  font-weight:700;
}
.mode:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- 工程チップ ---------- */
.steps{display:flex;flex-direction:column;gap:7px}
.chips{display:flex;gap:7px}
.chip{
  flex:1;
  text-align:center;
  padding:9px 4px;
  border-radius:10px;
  font-size:15px;font-weight:500;
  background:var(--panel);
  color:var(--ink-2);
  border:1.5px solid var(--line);
  transition:background .18s,color .18s,border-color .18s;
}
.chip.done{color:var(--ink);border-color:var(--line);opacity:.55}
.chip.now{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
  font-weight:700;
}
:root[data-theme="dark"] .chip.now{color:#12211D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.now{color:#12211D}}
.where{font-size:13px;color:var(--ink-2);text-align:center;letter-spacing:.04em}

/* ---------- 筆算ボード ---------- */
.board{
  position:relative;
  background:var(--panel);
  border-radius:var(--r);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:16px 10px 18px;
  display:flex;justify-content:center;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  background-position:center center;
  overflow:hidden;
}

.hissan{
  --cw:clamp(46px,13.5vw,60px);
  --ch:clamp(46px,13vw,58px);
  display:grid;
  grid-template-columns:var(--cw) var(--cw) var(--cw);
  grid-template-rows:repeat(6,var(--ch));
}
.cell{
  display:flex;align-items:center;justify-content:center;
  font-family:"Klee One","Hiragino Mincho ProN",serif;
  font-weight:600;
  font-size:clamp(29px,8vw,38px);
  line-height:1;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  position:relative;
}
.cell.given{color:var(--ink)}
.cell.slot::after{
  content:"";
  position:absolute;inset:5px;
  border-radius:9px;
  border:2px dashed var(--line);
  opacity:0;
  transition:opacity .18s;
}
.cell.pending::after{opacity:1}
.cell.active::after{
  opacity:1;
  border:2.5px solid var(--blue);
  border-style:solid;
  background:var(--blue-soft);
  animation:pulse 1.5s ease-in-out infinite;
}
.cell.choose{cursor:pointer}
.cell.choose::after{
  opacity:1;
  border:2.5px dashed var(--blue);
  background:transparent;
  animation:bob 1.6s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cell .val{position:relative;z-index:1}
.cell.wrong .val{color:var(--red)}
.cell.wrong{animation:shake .34s}
.cell.just .val{animation:pop .3s}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(28,109,168,0)}50%{box-shadow:0 0 0 5px rgba(28,109,168,.14)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* 筆算の記号 */
.dvd-l{
  border-left:3px solid var(--ink);
  border-top:3px solid var(--ink);
  border-top-left-radius:16px;
}
.dvd-r{border-top:3px solid var(--ink)}
.note{
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:5px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  font-size:12px;font-weight:500;
  color:var(--ink-2);
  white-space:nowrap;
}
.rule{
  grid-column:2 / 4;
  align-self:end;
  height:3px;
  background:var(--ink);
  border-radius:2px;
  opacity:0;
  transform:scaleX(.2);
  transform-origin:left center;
  transition:opacity .2s, transform .3s cubic-bezier(.2,.8,.3,1);
  pointer-events:none;
}
.rule.show{opacity:1;transform:scaleX(1)}

/* 花丸 */
.maru{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.maru svg{width:min(74%,260px);height:auto;overflow:visible}
.maru path{
  fill:none;
  stroke:var(--red);
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.88;
}

/* ---------- メッセージ ---------- */
.msg{
  min-height:46px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:0 4px;
}
.msg .guide{font-size:16px;font-weight:500;line-height:1.5}
.msg .sub{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.msg .sub.warn{color:var(--red);font-weight:500}
.msg .sub.hint{color:var(--blue);font-weight:500}

/* ---------- テンキー ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{
  font-family:"Klee One",serif;
  font-weight:600;
  font-size:26px;
  padding:13px 0;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .08s, background .15s;
  font-variant-numeric:tabular-nums;
}
.key:active{transform:translateY(2px);background:var(--blue-soft)}
.key:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.key.util{
  font-family:"Zen Maru Gothic",sans-serif;
  font-size:15px;font-weight:500;
  color:var(--ink-2);
  box-shadow:none;
  background:transparent;
}
.key.util:active{background:var(--panel)}

.next{
  width:100%;
  padding:19px 0;
  border-radius:12px;
  border:none;
  background:var(--red);
  color:#fff;
  font-family:inherit;font-size:19px;font-weight:700;
  cursor:pointer;
  box-shadow:var(--shadow);
}
:root[data-theme="dark"] .next{color:#2A1512}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{color:#2A1512}}
.next:active{transform:translateY(2px)}
.next:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.hidden{display:none !important}

/* ---------- きろく ---------- */
.sheet{
  position:fixed;inset:0;
  background:rgba(20,26,24,.42);
  display:flex;align-items:center;justify-content:center;
  padding:18px;
  z-index:20;
}
.sheet-in{
  background:var(--panel);
  border-radius:var(--r);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:22px;
  width:100%;max-width:400px;
  max-height:88vh;overflow:auto;
}
.sheet h2{margin:0 0 16px;font-size:17px;font-weight:700}
.stat-row{display:flex;gap:10px;margin-bottom:20px}
.stat{
  flex:1;text-align:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;padding:11px 4px;
}
.stat b{
  display:block;
  font-family:"Klee One",serif;font-size:27px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.15;
}
.stat span{font-size:11.5px;color:var(--ink-2)}
.sheet h3{margin:0 0 9px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.bar-row{display:grid;grid-template-columns:66px 1fr 30px;align-items:center;gap:9px;font-size:13.5px}
.bar-track{height:9px;background:var(--paper);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--red);border-radius:4px;transition:width .4s}
.bar-num{text-align:right;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-close{
  padding:11px 22px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;
}
.sheet-close:focus-visible,.linkbtn.danger:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.linkbtn.danger{color:var(--ink-2);font-size:12.5px}
.linkbtn.danger:hover{color:var(--red);border-bottom-color:var(--red)}
.empty{font-size:13.5px;color:var(--ink-2);line-height:1.6}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

<div class="app">
  <div class="top">
    <h1 class="title">わり算の筆算道場</h1>
    <button class="linkbtn" id="recBtn">きろく</button>
  </div>

  <button class="setbtn" id="setBtn" type="button" aria-haspopup="dialog">
    <span id="setLabel">商2けた・あまりなし</span>
    <span class="caret" aria-hidden="true">▼</span>
  </button>

  <div class="steps">
    <div class="chips" id="chips"></div>
    <div class="where" id="where"></div>
  </div>

  <div class="board">
    <div class="hissan" id="hissan"></div>
    <div class="maru hidden" id="maru"></div>
  </div>

  <div class="msg">
    <div class="guide" id="guide"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="pad" id="pad"></div>
  <button class="next hidden" id="nextBtn">つぎのもんだい</button>
  <div class="count" id="count" style="text-align:center"></div>
</div>

<script>
(function(){
  "use strict";

  var KEY     = "warizan-hissan-v1";
  var MODEKEY = "warizan-hissan-mode";   // 商のけた数
  var REMKEY  = "warizan-hissan-rem";    // あまり
  var STEPNAMES = ["たてる","かける","ひく","おろす"];
  var ERRKEYS   = ["たてる","かける","ひく","おろす","立てる位"];
  var KINDS = [{id:"two",label:"商2けた"},{id:"one",label:"商1けた"},{id:"mix",label:"まぜる"}];
  var REMS  = [{id:"none",label:"あまりなし"},{id:"some",label:"あまりあり"},{id:"mix",label:"まぜる"}];

  /* ---------- きろく ---------- */
  function blank(){
    var e={};
    ERRKEYS.forEach(function(k){ e[k]=0; });
    return {solved:0, perfect:0, streak:0, best:0, errors:e};
  }
  var rec = blank();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var pv = JSON.parse(raw);
      if(pv && typeof pv === "object"){
        rec.solved = pv.solved|0; rec.perfect = pv.perfect|0;
        rec.streak = pv.streak|0; rec.best = pv.best|0;
        if(pv.errors) for(var k in rec.errors) rec.errors[k] = pv.errors[k]|0;
      }
    }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(rec)); }catch(e){} }

  /* ---------- せってい ---------- */
  var kindMode = "two", remMode = "none";
  function loadSet(){
    try{
      var a = localStorage.getItem(MODEKEY);
      if(a && KINDS.some(function(x){ return x.id===a; })) kindMode = a;
      var b = localStorage.getItem(REMKEY);
      if(b && REMS.some(function(x){ return x.id===b; })) remMode = b;
    }catch(e){}
  }
  function saveSet(){
    try{
      localStorage.setItem(MODEKEY, kindMode);
      localStorage.setItem(REMKEY, remMode);
    }catch(e){}
  }
  loadSet();

  /* ---------- もんだいの一覧を つくる ---------- */
  // わる数 2〜9、わられる数 10〜99 を すべて 4つの箱に 仕分ける
  var POOLS = (function(){
    var P = {two:{none:[],some:[]}, one:{none:[],some:[]}};
    for(var v=2; v<=9; v++){
      for(var n=10; n<=99; n++){
        var d0 = Math.floor(n/10), d1 = n%10, r = n%v;
        var bin = (r===0) ? "none" : "some";
        if(d0 >= v){
          // 商が2けた
          var q0=Math.floor(d0/v), s1=d0-q0*v, mid=s1*10+d1, q1=Math.floor(mid/v);
          if(q1 === 0) continue;          // 商に0が立つ形は 今回は出さない
          P.two[bin].push([n,v]);
        }else{
          P.one[bin].push([n,v]);         // 商が1けた
        }
      }
    }
    return P;
  })();

  function kindIds(){ return kindMode==="mix" ? ["two","one"] : [kindMode]; }
  function remIds(){  return remMode==="mix"  ? ["none","some"] : [remMode]; }
  function poolCount(){
    var c = 0;
    kindIds().forEach(function(k){ remIds().forEach(function(r){ c += POOLS[k][r].length; }); });
    return c;
  }
  function setLabel(){
    if(kindMode==="mix" && remMode==="mix") return "ぜんぶまぜる";
    var kl = {two:"商2けた", one:"商1けた", mix:"商まぜる"}[kindMode];
    var rl = {none:"あまりなし", some:"あまりあり", mix:"あまりまぜる"}[remMode];
    return kl + "・" + rl;
  }

  /* ---------- もんだいを つくる ---------- */
  var lastN = -1, lastKind = "", lastRem = "";

  // まぜるときは 同じ種類が続きすぎないようにする
  function pickCat(setting, opts, last){
    if(setting !== "mix") return setting;
    var c = opts[Math.floor(Math.random()*opts.length)];
    if(c === last && Math.random() < 0.5) c = (c === opts[0]) ? opts[1] : opts[0];
    return c;
  }

  function newState(kind,v,q,r,n,d0,d1,exp,steps){
    return {kind:kind, v:v, q:q, r:r, n:n, d0:d0, d1:d1, exp:exp, steps:steps,
            filled:{}, si:0, ci:0, sel:null, mistakes:0, done:false};
  }

  // 商が2けた（十の位から商が立つ）
  function twoDigit(n, v, place){
    var d0=Math.floor(n/10), d1=n%10;
    var q0=Math.floor(d0/v), p1=q0*v, s1=d0-p1;
    var mid=s1*10+d1, q1=Math.floor(mid/v), p2=q1*v, r=mid-p2;
    var q=q0*10+q1;

    var exp = {q0:q0, q1:q1,
               m1t:p1, m1o:null,
               s1t:s1, s1o:d1,
               m2t:(p2>=10 ? Math.floor(p2/10) : null), m2o:p2%10,
               s2t:null, s2o:r};

    var steps = [
      {k:"たてる", cells:["q0"], place:place, into:d0,
       guide: place ? "商を立てる位をえらんでタップしよう" : "十の位に商をたてよう",
       hint:  place ? ("十の位の "+d0+" は "+v+" でわれるね。だから商は十の位から。"+d0+" ÷ "+v+" は？")
                    : (d0+" ÷ "+v+" は いくつ？（あまりは 気にしない）")},
      {k:"かける", cells:["m1t"],
       guide:"たてた商と、わる数をかけよう", hint:q0+" × "+v+" は？"},
      {k:"ひく",   cells:["s1t"],
       guide:"上の数から、かけた数をひこう", hint:d0+" − "+p1+" は？"},
      {k:"おろす", cells:["s1o"],
       guide:"一の位の数をおろそう",         hint:"一の位の "+d1+" を そのまま 下におろす"},
      {k:"たてる", cells:["q1"], into:mid,
       guide:"一の位に商をたてよう",         hint:mid+" ÷ "+v+" は いくつ？（あまりは 気にしない）"},
      {k:"かける", cells:(p2>=10 ? ["m2t","m2o"] : ["m2o"]),
       guide:"たてた商と、わる数をかけよう", hint:q1+" × "+v+" は？"},
      {k:"ひく",   cells:["s2o"], last:true,
       guide: r===0 ? "上の数から、かけた数をひこう" : "上の数から、かけた数をひこう。のこりがあまり",
       hint:  mid+" − "+p2+" は？" + (r===0 ? "（0 になるよ）" : "（のこりが あまり）")}
    ];
    return newState("two",v,q,r,n,d0,d1,exp,steps);
  }

  // 商が1けた（十の位には商が立たない）
  function oneDigit(n, v, place){
    var d0=Math.floor(n/10), d1=n%10;
    var q=Math.floor(n/v), p=q*v, r=n-p;

    var exp = {q0:null, q1:q,
               m1t:(p>=10 ? Math.floor(p/10) : null), m1o:p%10,
               s1t:null, s1o:r,
               m2t:null, m2o:null, s2t:null, s2o:null};

    var steps = [
      {k:"たてる", cells:["q1"], place:place, into:n,
       guide: place ? "商を立てる位をえらんでタップしよう" : "一の位に商をたてよう",
       hint:"十の位の "+d0+" は "+v+" より小さいから、十の位には立たない。"+n+" ÷ "+v+" は？"},
      {k:"かける", cells:(p>=10 ? ["m1t","m1o"] : ["m1o"]),
       guide:"たてた商と、わる数をかけよう", hint:q+" × "+v+" は？"},
      {k:"ひく",   cells:["s1o"], last:true,
       guide: r===0 ? "上の数から、かけた数をひこう" : "上の数から、かけた数をひこう。のこりがあまり",
       hint:  n+" − "+p+" は？" + (r===0 ? "（0 になるよ）" : "（のこりが あまり）")}
    ];
    return newState("one",v,q,r,n,d0,d1,exp,steps);
  }

  function makeProblem(){
    var kind = pickCat(kindMode, ["two","one"], lastKind);
    var rem  = pickCat(remMode,  ["none","some"], lastRem);
    lastKind = kind; lastRem = rem;

    var pool = POOLS[kind][rem];
    var pick, t = 0;
    do{
      pick = pool[Math.floor(Math.random()*pool.length)];
      t++;
    }while(pool.length > 1 && pick[0] === lastN && t < 40);
    lastN = pick[0];

    var place = (kindMode !== "two");   // 商1けたがありうるときだけ位をえらばせる
    return (kind === "one") ? oneDigit(pick[0], pick[1], place)
                            : twoDigit(pick[0], pick[1], place);
  }

  var P = makeProblem();

  /* ---------- 筆算を 組み立てる ---------- */
  var hissan = document.getElementById("hissan");
  var cellEl = {};

  function buildBoard(){
    hissan.innerHTML = "";
    cellEl = {};

    function put(row, col, cls, text, id){
      var d = document.createElement("div");
      d.className = "cell " + (cls||"");
      d.style.gridRow = row;
      d.style.gridColumn = col;
      var sp = document.createElement("span");
      sp.className = "val";
      sp.textContent = (text == null ? "" : text);
      d.appendChild(sp);
      if(id){
        cellEl[id] = d;
        if(id === "q0" || id === "q1"){
          d.setAttribute("role","button");
          d.addEventListener("click", function(){ selectCell(id); });
        }
      }
      hissan.appendChild(d);
      return d;
    }

    put(1, 2, "slot", "", "q0");
    put(1, 3, "slot", "", "q1");

    put(2, 1, "given", P.v);
    put(2, 2, "given dvd-l", P.d0);
    put(2, 3, "given dvd-r", P.d1);

    put(3, 2, "slot", "", "m1t");
    put(3, 3, "slot", "", "m1o");
    put(4, 2, "slot", "", "s1t");
    put(4, 3, "slot", "", "s1o");
    put(5, 2, "slot", "", "m2t");
    put(5, 3, "slot", "", "m2o");
    put(6, 2, "slot", "", "s2t");
    put(6, 3, "slot", "", "s2o");

    var r1 = document.createElement("div");
    r1.className = "rule"; r1.style.gridRow = 3; r1.id = "rule1";
    hissan.appendChild(r1);
    var r2 = document.createElement("div");
    r2.className = "rule"; r2.style.gridRow = 5; r2.id = "rule2";
    hissan.appendChild(r2);

    // 「あまり」のふだ（できあがってから、あまりがあるときだけ出す）
    var note = document.createElement("div");
    note.className = "note hidden";
    note.id = "remNote";
    note.style.gridRow = (P.kind === "two") ? 6 : 4;
    note.style.gridColumn = 1;
    note.textContent = "あまり";
    hissan.appendChild(note);
  }

  /* ---------- 画面を ぬりかえる ---------- */
  var setBtn   = document.getElementById("setBtn");
  var setLbl   = document.getElementById("setLabel");
  var chipsEl  = document.getElementById("chips");
  var whereEl  = document.getElementById("where");
  var guideEl  = document.getElementById("guide");
  var subEl    = document.getElementById("sub");
  var countEl  = document.getElementById("count");
  var padEl    = document.getElementById("pad");
  var nextBtn  = document.getElementById("nextBtn");
  var maruEl   = document.getElementById("maru");

  function render(keepSub){
    var step    = P.done ? null : P.steps[P.si];
    var isPlace = !!(step && step.place);
    var act     = P.done ? null : (isPlace ? P.sel : step.cells[P.ci]);

    setLbl.textContent = setLabel();

    // 工程チップ
    chipsEl.innerHTML = "";
    STEPNAMES.forEach(function(name){
      var c = document.createElement("div");
      c.className = "chip";
      if(step && step.k === name) c.className += " now";
      c.textContent = name;
      chipsEl.appendChild(c);
    });

    whereEl.textContent = P.done ? "できあがり"
      : (isPlace ? "商はどの位に立つ？"
        : (P.kind === "one" ? "一の位の計算"
          : (P.si <= 3 ? "十の位の計算" : "一の位の計算")));

    // マス
    for(var id in cellEl){
      var el = cellEl[id];
      var v  = P.filled[id];
      el.querySelector(".val").textContent = (v == null ? "" : v);
      el.classList.remove("active","pending","choose");
      if(P.done || !step) continue;
      if(isPlace){
        if(id === "q0" || id === "q1"){
          el.classList.add(id === P.sel ? "active" : "choose");
        }
      }else{
        if(id === act) el.classList.add("active");
        else if(step.cells.indexOf(id) >= 0) el.classList.add("pending");
      }
    }

    // ひき算の線（商1けたのときは1本だけ）
    document.getElementById("rule1").classList.toggle("show", P.si >= 2);
    document.getElementById("rule2").classList.toggle("show",
      P.kind === "two" && P.si >= 6);

    // 「あまり」のふだ
    document.getElementById("remNote").classList.toggle("hidden", !(P.done && P.r > 0));

    // メッセージ
    if(P.done){
      guideEl.textContent = P.mistakes === 0 ? "せいかい！ ノーミス！" : "せいかい！";
      subEl.className = "sub";
      subEl.textContent = P.n + " ÷ " + P.v + " = " + P.q
        + (P.r > 0 ? " あまり " + P.r : "")
        + (P.mistakes === 0 ? "" : "（まちがい " + P.mistakes + "回）");
    }else{
      guideEl.textContent = (isPlace ? "たてる：" : step.k + "：") + step.guide;
      if(!keepSub){ subEl.className = "sub"; subEl.textContent = ""; }
    }

    padEl.classList.toggle("hidden", P.done);
    nextBtn.classList.toggle("hidden", !P.done);
    countEl.textContent = "といた数 " + rec.solved + "　花丸 " + rec.perfect
                        + "　連続 " + rec.streak;
  }

  function say(cls, text){
    subEl.className = "sub " + cls;
    subEl.textContent = text;
  }

  /* ---------- 商を立てる位をえらぶ ---------- */
  function selectCell(id){
    if(P.done) return;
    var step = P.steps[P.si];
    if(!step.place) return;
    if(id !== "q0" && id !== "q1") return;
    P.sel = id;
    render();
  }

  /* ---------- まちがいの ことば ---------- */
  function wrongText(step, target, dig, placeErr){
    if(placeErr){
      return (P.kind === "one")
        ? "十の位の " + P.d0 + " は " + P.v + " より小さいね。十の位に商は立たないよ"
        : "十の位の " + P.d0 + " は " + P.v + " でわれるよ。商は十の位から立つね";
    }
    if(step.k === "たてる" && step.into != null){
      var want = P.exp[target];
      return (dig > want)
        ? "大きすぎるよ。" + dig + " × " + P.v + " = " + (dig*P.v) + " で、" + step.into + " より大きいね"
        : "小さすぎるよ。ひいたあとが まだ " + P.v + " でわれてしまうね";
    }
    if(step.k === "ひく" && dig >= P.v){
      return (step.last ? "あまりは " : "ひいたあとは ")
           + "わる数の " + P.v + " より小さくなるはずだよ";
    }
    return "おしい！ もう一度 " + step.k + "を やってみよう";
  }

  /* ---------- 入力 ---------- */
  function press(dig){
    if(P.done) return;
    var step = P.steps[P.si];
    var target, placeErr = false;

    if(step.place){
      if(!P.sel){
        say("warn", "まず、商を書くマスをタップしてね");
        return;
      }
      target = P.sel;
      if(target !== step.cells[0]) placeErr = true;
    }else{
      target = step.cells[P.ci];
    }

    var el = cellEl[target];

    if(!placeErr && P.exp[target] === dig){
      P.filled[target] = dig;
      el.classList.remove("wrong");
      el.classList.add("just");
      setTimeout(function(){ el.classList.remove("just"); }, 320);

      P.ci++;
      if(P.ci >= step.cells.length){
        P.ci = 0; P.si++; P.sel = null;
        if(P.si >= P.steps.length) finish();
      }
      render();
      return;
    }

    // まちがい
    P.mistakes++;
    var ekey = placeErr ? "立てる位" : step.k;
    rec.errors[ekey] = (rec.errors[ekey]|0) + 1;
    save();

    el.querySelector(".val").textContent = dig;
    el.classList.add("wrong");
    say("warn", wrongText(step, target, dig, placeErr));
    if(placeErr) P.sel = null;

    setTimeout(function(){
      el.classList.remove("wrong");
      render(true);          // えらび直しを反映しつつ ことばは残す
    }, 700);
  }

  function showHint(){
    if(P.done) return;
    say("hint", "ヒント：" + P.steps[P.si].hint);
  }

  function retry(){
    P.filled = {}; P.si = 0; P.ci = 0; P.sel = null;
    P.mistakes = 0; P.done = false;
    maruEl.classList.add("hidden");
    render();
  }

  /* ---------- 花丸 ---------- */
  function flowerPath(cx, cy, r, petals){
    var d = "", R = r*1.28;
    for(var i=0;i<petals;i++){
      var a0 = (i/petals)*Math.PI*2 - Math.PI/2;
      var a1 = ((i+1)/petals)*Math.PI*2 - Math.PI/2;
      var ca = a0 + (a1-a0)*0.28, cb = a0 + (a1-a0)*0.72;
      var x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
      var x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
      var xa = cx + R*Math.cos(ca), ya = cy + R*Math.sin(ca);
      var xb = cx + R*Math.cos(cb), yb = cy + R*Math.sin(cb);
      if(i === 0) d += "M" + x0.toFixed(1) + " " + y0.toFixed(1);
      d += "C" + xa.toFixed(1) + " " + ya.toFixed(1) + " "
              + xb.toFixed(1) + " " + yb.toFixed(1) + " "
              + x1.toFixed(1) + " " + y1.toFixed(1);
    }
    return d + "Z";
  }

  function drawMaru(perfect){
    var d = perfect ? flowerPath(100, 100, 74, 9)
                    : "M100 26 A74 74 0 1 1 99.9 26 Z";
    maruEl.innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true"><path d="'
                     + d + '"></path></svg>';
    maruEl.classList.remove("hidden");
    var path = maruEl.querySelector("path");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!reduce && path.getTotalLength){
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      path.animate(
        [{strokeDashoffset:len},{strokeDashoffset:0}],
        {duration:750, easing:"cubic-bezier(.3,.7,.3,1)", fill:"forwards"}
      );
    }
  }

  function finish(){
    P.done = true;
    rec.solved++;
    if(P.mistakes === 0){
      rec.perfect++;
      rec.streak++;
      if(rec.streak > rec.best) rec.best = rec.streak;
    }else{
      rec.streak = 0;
    }
    save();
    drawMaru(P.mistakes === 0);
  }

  /* ---------- シート（共通） ---------- */
  function openSheet(html, label, mount, opener){
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML = '<div class="sheet-in" role="dialog" aria-modal="true" aria-label="'
                    + label + '">' + html + '</div>';
    document.body.appendChild(sheet);
    function close(){ sheet.remove(); if(opener) opener.focus(); }
    sheet.addEventListener("click", function(e){ if(e.target === sheet) close(); });
    var c = sheet.querySelector("#closeSheet");
    if(c){ c.addEventListener("click", close); c.focus(); }
    if(mount) mount(sheet, close);
    return sheet;
  }

  /* ---------- せっていシート ---------- */
  function segHTML(id, items, cur){
    return '<div class="segs" id="' + id + '">'
      + items.map(function(it){
          return '<button class="mode" type="button" data-id="' + it.id + '" aria-pressed="'
               + (it.id === cur) + '">' + it.label + '</button>';
        }).join("")
      + '</div>';
  }

  setBtn.addEventListener("click", function(){
    var html = '<h2>もんだいの種類</h2>'
      + '<h3>商のけた数</h3>' + segHTML("segKind", KINDS, kindMode)
      + '<h3>あまり</h3>'     + segHTML("segRem",  REMS,  remMode)
      + '<p class="empty" id="poolInfo"></p>'
      + '<div class="sheet-actions">'
      +   '<button class="sheet-close" id="closeSheet">とじる</button>'
      + '</div>';

    openSheet(html, "もんだいの種類", function(sheet){
      var info = sheet.querySelector("#poolInfo");
      function refresh(){
        info.textContent = "いま出るのは " + poolCount() + " 通り。"
          + (kindMode === "two"
              ? "商は必ず十の位から立つので、書く位置はアプリが決めます。"
              : "商を立てる位は、子どもがえらびます。");
        ["segKind","segRem"].forEach(function(gid){
          var cur = (gid === "segKind") ? kindMode : remMode;
          sheet.querySelectorAll("#" + gid + " .mode").forEach(function(b){
            b.setAttribute("aria-pressed", String(b.getAttribute("data-id") === cur));
          });
        });
      }
      sheet.querySelectorAll("#segKind .mode").forEach(function(b){
        b.addEventListener("click", function(){
          kindMode = b.getAttribute("data-id"); saveSet(); refresh(); nextProblem();
        });
      });
      sheet.querySelectorAll("#segRem .mode").forEach(function(b){
        b.addEventListener("click", function(){
          remMode = b.getAttribute("data-id"); saveSet(); refresh(); nextProblem();
        });
      });
      refresh();
    }, setBtn);
  });

  /* ---------- きろくシート ---------- */
  var recBtn = document.getElementById("recBtn");
  recBtn.addEventListener("click", function(){
    var total = 0;
    ERRKEYS.forEach(function(k){ total += (rec.errors[k]|0); });

    var bars = ERRKEYS.map(function(k){
      var n = rec.errors[k]|0;
      var w = total ? Math.round(n/total*100) : 0;
      return '<div class="bar-row"><span>' + k + '</span>'
           + '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>'
           + '<span class="bar-num">' + n + '</span></div>';
    }).join("");

    var html = ''
      + '<h2>きろく</h2>'
      + '<div class="stat-row">'
      +   '<div class="stat"><b>' + rec.solved  + '</b><span>といた数</span></div>'
      +   '<div class="stat"><b>' + rec.perfect + '</b><span>花丸</span></div>'
      +   '<div class="stat"><b>' + rec.best    + '</b><span>連続さいこう</span></div>'
      + '</div>'
      + '<h3>つまずいた工程</h3>'
      + (total ? '<div class="bars">' + bars + '</div>'
               : '<p class="empty">まだ まちがいは ありません。</p>')
      + '<div class="sheet-actions">'
      +   '<button class="sheet-close" id="closeSheet">とじる</button>'
      +   '<button class="linkbtn danger" id="resetRec">きろくを消す</button>'
      + '</div>';

    openSheet(html, "きろく", function(sheet, close){
      sheet.querySelector("#resetRec").addEventListener("click", function(){
        if(confirm("きろくを すべて 消しますか？")){
          rec = blank(); save(); close(); render();
        }
      });
    }, recBtn);
  });

  /* ---------- テンキー ---------- */
  function buildPad(){
    padEl.innerHTML = "";
    [1,2,3,4,5,6,7,8,9].forEach(function(d){
      var b = document.createElement("button");
      b.className = "key"; b.type = "button"; b.textContent = d;
      b.addEventListener("click", function(){ press(d); });
      padEl.appendChild(b);
    });
    var h = document.createElement("button");
    h.className = "key util"; h.type = "button"; h.textContent = "ヒント";
    h.addEventListener("click", showHint);
    padEl.appendChild(h);

    var z = document.createElement("button");
    z.className = "key"; z.type = "button"; z.textContent = "0";
    z.addEventListener("click", function(){ press(0); });
    padEl.appendChild(z);

    var r = document.createElement("button");
    r.className = "key util"; r.type = "button"; r.textContent = "やりなおす";
    r.addEventListener("click", retry);
    padEl.appendChild(r);
  }

  document.addEventListener("keydown", function(e){
    if(document.querySelector(".sheet")) return;   // シートが開いているときは何もしない
    if(e.key >= "0" && e.key <= "9"){ press(parseInt(e.key,10)); }
    else if(e.key === "Enter" && P.done){ nextProblem(); }
    else if(!P.done && P.steps[P.si].place){
      if(e.key === "ArrowLeft"){ selectCell("q0"); e.preventDefault(); }
      else if(e.key === "ArrowRight"){ selectCell("q1"); e.preventDefault(); }
    }
  });

  function nextProblem(){
    P = makeProblem();
    maruEl.classList.add("hidden");
    buildBoard();
    render();
  }
  nextBtn.addEventListener("click", nextProblem);

  buildBoard();
  buildPad();
  render();
})();
</script>
