<title>わり算の筆算道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">

<style>
:root{
  --paper:#FBFAF5;
  --panel:#FFFFFF;
  --grid:#DCE4E3;
  --ink:#2A3134;
  --ink-2:#707A7D;
  --line:#C6CFD1;
  --red:#CE3F2C;
  --red-soft:#F7E3DE;
  --blue:#1C6DA8;
  --blue-soft:#E3EEF6;
  --shadow:0 1px 2px rgba(42,49,52,.07), 0 6px 20px rgba(42,49,52,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D2925;
    --panel:#25332E;
    --grid:#2F403A;
    --ink:#ECF1EA;
    --ink-2:#9DAEA6;
    --line:#3D4F48;
    --red:#F1866F;
    --red-soft:#3B2A27;
    --blue:#7DC3E7;
    --blue-soft:#1E3038;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#1D2925;
  --panel:#25332E;
  --grid:#2F403A;
  --ink:#ECF1EA;
  --ink-2:#9DAEA6;
  --line:#3D4F48;
  --red:#F1866F;
  --red-soft:#3B2A27;
  --blue:#7DC3E7;
  --blue-soft:#1E3038;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}

.app{
  max-width:540px;
  margin:0 auto;
  padding:16px 16px 22px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
/* たて向き・せまい画面では入れ物を消して、今まで通りの1列にする */
.body,.colA,.colB{display:contents}
.count{text-align:center}

/* ---------- ヘッダー ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.title{font-size:19px;font-weight:700;letter-spacing:.02em;margin:0}
.count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.linkbtn{
  background:none;border:none;padding:4px 2px;margin:0;
  font:inherit;font-size:13px;color:var(--blue);cursor:pointer;
  border-bottom:1px solid transparent;
}
.linkbtn:hover{border-bottom-color:var(--blue)}
.linkbtn:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

/* ---------- もんだいの種類 ---------- */
.setbtn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;
  padding:9px 13px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;
  transition:border-color .15s;
}
.setbtn:hover{border-color:var(--ink-2)}
.setbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.setbtn .caret{color:var(--ink-2);font-size:11px}
.segs{display:flex;gap:6px;margin-bottom:16px}
.mode{
  flex:1;
  padding:7px 4px;
  border-radius:9px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--ink-2);
  font-family:inherit;font-size:12.5px;font-weight:500;
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.mode[aria-pressed="true"]{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper);
  font-weight:700;
}
.mode:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- 工程チップ ---------- */
.steps{display:flex;flex-direction:column;gap:7px}
.chips{display:flex;gap:7px}
.chip{
  flex:1;
  text-align:center;
  padding:9px 4px;
  border-radius:10px;
  font-size:15px;font-weight:500;
  background:var(--panel);
  color:var(--ink-2);
  border:1.5px solid var(--line);
  transition:background .18s,color .18s,border-color .18s;
}
.chip.done{color:var(--ink);border-color:var(--line);opacity:.55}
.chip.now{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
  font-weight:700;
}
:root[data-theme="dark"] .chip.now{color:#12211D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.now{color:#12211D}}
.where{font-size:13px;color:var(--ink-2);text-align:center;letter-spacing:.04em}

/* ---------- 筆算ボード ---------- */
.board{
  position:relative;
  background:var(--panel);
  border-radius:var(--r);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:16px 10px 18px;
  display:flex;justify-content:center;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  background-position:center center;
  overflow:hidden;
}

.hissan{
  --cwbase:clamp(38px,13.5vw,60px);
  --chbase:clamp(38px,13vw,58px);
  /* 列が増えても画面からはみ出さないように、幅で頭打ちにする */
  --cw:min(var(--cwbase), calc((100vw - 70px) / var(--cols, 3)));
  --ch:min(var(--chbase), var(--cw));
  display:grid;
}
.cell{
  display:flex;align-items:center;justify-content:center;
  font-family:"Klee One","Hiragino Mincho ProN",serif;
  font-weight:600;
  font-size:min(clamp(24px,8vw,38px), calc(var(--cw) * 0.66));
  line-height:1;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  position:relative;
}
.cell.given{color:var(--ink)}
.cell.slot::after{
  content:"";
  position:absolute;inset:5px;
  border-radius:9px;
  border:2px dashed var(--line);
  opacity:0;
  transition:opacity .18s;
}
.cell.pending::after{opacity:1}
.cell.active::after{
  opacity:1;
  border:2.5px solid var(--blue);
  border-style:solid;
  background:var(--blue-soft);
  animation:pulse 1.5s ease-in-out infinite;
}
.cell.choose{cursor:pointer}
.cell.choose::after{
  opacity:1;
  border:2.5px dashed var(--blue);
  background:transparent;
  animation:bob 1.6s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cell .val{position:relative;z-index:1}
.cell.wrong .val{color:var(--red)}
.cell.wrong{animation:shake .34s}
.cell.just .val{animation:pop .3s}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(28,109,168,0)}50%{box-shadow:0 0 0 5px rgba(28,109,168,.14)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* くり上がりを書く小さいマス（くり上がりを足しこむけたの右肩） */
.carrybox{
  position:absolute;
  top:calc(var(--cw) * 0.02);
  right:calc(var(--cw) * 0.02);
  width:calc(var(--cw) * 0.38);
  height:calc(var(--cw) * 0.38);
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  border:1.5px dashed transparent;
  font-family:"Klee One","Hiragino Mincho ProN",serif;
  font-weight:600;
  font-size:calc(var(--cw) * 0.28);
  line-height:1;
  color:var(--ink);
  z-index:3;
  transition:border-color .18s, background .18s;
}
.carrybox.pending{border-color:var(--line)}
.carrybox.active{
  border:2px solid var(--blue);
  background:var(--blue-soft);
  animation:pulse 1.5s ease-in-out infinite;
}
.carrybox.wrong{animation:shake .34s}
.carrybox.wrong .val{color:var(--red)}
.carrybox.just .val{animation:pop .3s}

/* 筆算の記号 */
.dvd-l{
  border-left:3px solid var(--ink);
  border-top:3px solid var(--ink);
  border-top-left-radius:16px;
}
.dvd-r{border-top:3px solid var(--ink)}
.note{
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:5px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  font-size:12px;font-weight:500;
  color:var(--ink-2);
  white-space:nowrap;
}
.rule{
  grid-column:2 / 4;
  align-self:end;
  height:3px;
  background:var(--ink);
  border-radius:2px;
  opacity:0;
  transform:scaleX(.2);
  transform-origin:left center;
  transition:opacity .2s, transform .3s cubic-bezier(.2,.8,.3,1);
  pointer-events:none;
}
.rule.show{opacity:1;transform:scaleX(1)}

/* 花丸 */
.maru{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.maru svg{width:min(84%,320px);height:auto;overflow:visible}
.maru path{
  fill:none;
  stroke:var(--red);
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.88;
}

/* ---------- メッセージ ---------- */
.msg{
  min-height:46px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:0 4px;
}
.msg .guide{font-size:16px;font-weight:500;line-height:1.5}
.msg .sub{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.msg .sub.warn{color:var(--red);font-weight:500}
.msg .sub.hint{color:var(--blue);font-weight:500}

/* ---------- テンキー ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{
  font-family:"Klee One",serif;
  font-weight:600;
  font-size:26px;
  padding:13px 0;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .08s, background .15s;
  font-variant-numeric:tabular-nums;
}
.key:active{transform:translateY(2px);background:var(--blue-soft)}
.key:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.key.util{
  font-family:"Zen Maru Gothic",sans-serif;
  font-size:15px;font-weight:500;
  color:var(--ink-2);
  box-shadow:none;
  background:transparent;
}
.key.util:active{background:var(--panel)}

.next{
  width:100%;
  padding:19px 0;
  border-radius:12px;
  border:none;
  background:var(--red);
  color:#fff;
  font-family:inherit;font-size:19px;font-weight:700;
  cursor:pointer;
  box-shadow:var(--shadow);
}
:root[data-theme="dark"] .next{color:#2A1512}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{color:#2A1512}}
.next:active{transform:translateY(2px)}
.next:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.hidden{display:none !important}

/* ---------- きろく ---------- */
.sheet{
  position:fixed;inset:0;
  background:rgba(20,26,24,.42);
  display:flex;align-items:center;justify-content:center;
  padding:18px;
  z-index:20;
}
.sheet-in{
  background:var(--panel);
  border-radius:var(--r);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:22px;
  width:100%;max-width:400px;
  max-height:88vh;overflow:auto;
}
.sheet h2{margin:0 0 16px;font-size:17px;font-weight:700}
.stat-row{display:flex;gap:10px;margin-bottom:20px}
.stat{
  flex:1;text-align:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;padding:11px 4px;
}
.stat b{
  display:block;
  font-family:"Klee One",serif;font-size:27px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.15;
}
.stat span{font-size:11.5px;color:var(--ink-2)}
.sheet h3{margin:0 0 9px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.bar-row{display:grid;grid-template-columns:74px 1fr 28px;align-items:center;gap:9px;font-size:13.5px}
.bar-track{height:9px;background:var(--paper);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--red);border-radius:4px;transition:width .4s}
.bar-num{text-align:right;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-close{
  padding:11px 22px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;
}
.sheet-close:focus-visible,.linkbtn.danger:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.linkbtn.danger{color:var(--ink-2);font-size:12.5px}
.linkbtn.danger:hover{color:var(--red);border-bottom-color:var(--red)}
.empty{font-size:13.5px;color:var(--ink-2);line-height:1.6}

/* ---------- 横向き（iPadなど）は2カラム ---------- */
@media (orientation:landscape) and (min-width:760px){
  .app{
    max-width:880px;
    padding:14px 20px 18px;
    gap:10px;
  }
  .body{
    display:flex;
    flex-direction:row;
    align-items:center;      /* テンキーを筆算の高さの真ん中にそろえる */
    justify-content:center;
    gap:24px;
  }
  .colA{
    display:flex;flex-direction:column;gap:10px;
    flex:1 1 400px;
    min-width:0;
    max-width:440px;
  }
  .colB{
    display:flex;flex-direction:column;gap:10px;
    flex:0 0 auto;
    width:clamp(250px,30vw,330px);
  }
  /* 画面の高さに合わせて、あいた分だけ大きくする */
  .hissan{
    --cwbase:clamp(30px,9.6vh,80px);
    --chbase:clamp(28px,9.2vh,76px);
    --cw:min(var(--cwbase), calc((min(100vw, 460px) - 40px) / var(--cols, 3)));
  }
  .cell{font-size:min(clamp(20px,6vh,50px), calc(var(--cw) * 0.66))}
  .note{font-size:clamp(11px,1.6vh,14px)}
  .board{padding:12px 10px 14px}
  .msg{min-height:44px}
  .key{
    padding:clamp(8px,2.1vh,20px) 0;
    font-size:clamp(19px,3.8vh,30px);
  }
  .key.util{font-size:clamp(12px,2.1vh,17px)}
  .next{padding:clamp(12px,2.8vh,22px) 0}
}

/* 横向きで画面が低いとき（スマホなど）はさらに詰める */
@media (orientation:landscape) and (min-width:760px) and (max-height:560px){
  .app{padding:10px 16px 12px;gap:8px}
  .body{gap:18px}
  .colA,.colB{gap:8px}
  .title{font-size:16px}
  .setbtn{padding:6px 11px;font-size:12px}
  .chip{padding:6px 4px;font-size:13px}
  .steps{gap:5px}
  .where{font-size:12px}
  .board{padding:8px 8px 10px}
  .hissan{
    --cwbase:clamp(24px,7.2vh,46px);
    --chbase:clamp(22px,6.8vh,44px);
  }
  .cell{font-size:min(clamp(15px,4.6vh,30px), calc(var(--cw) * 0.66))}
  .key{padding:clamp(6px,1.6vh,13px) 0;font-size:clamp(16px,3vh,23px)}
  .key.util{font-size:clamp(11px,1.7vh,14px)}
  .msg{min-height:36px}
  .msg .guide{font-size:14.5px}
  .msg .sub{font-size:12.5px}
}

/* たて向きのスマホ（iPadのたて向きには効かない） */
@media (orientation:portrait) and (max-width:500px){
  .app{padding:12px 16px 10px;gap:11px}
  .hissan{
    --cwbase:clamp(34px,12.5vw,52px);
    --chbase:clamp(32px,12vw,50px);
  }
  .cell{font-size:min(clamp(22px,7.4vw,34px), calc(var(--cw) * 0.66))}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

<div class="app">
  <div class="top">
    <h1 class="title">わり算の筆算道場</h1>
    <button class="linkbtn" id="recBtn">きろく</button>
  </div>

  <div class="body">
    <div class="colA">
      <button class="setbtn" id="setBtn" type="button" aria-haspopup="dialog">
        <span id="setLabel">商2けた・あまりなし</span>
        <span class="caret" aria-hidden="true">▼</span>
      </button>

      <div class="steps">
        <div class="chips" id="chips"></div>
        <div class="where" id="where"></div>
      </div>

      <div class="board">
        <div class="hissan" id="hissan"></div>
        <div class="maru hidden" id="maru"></div>
      </div>

      <div class="msg">
        <div class="guide" id="guide"></div>
        <div class="sub" id="sub"></div>
      </div>
    </div>

    <div class="colB">
      <div class="pad" id="pad"></div>
      <button class="next hidden" id="nextBtn">つぎのもんだい</button>
      <div class="count" id="count"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var KEY     = "warizan-hissan-v1";
  var DIVKEY  = "warizan-hissan-div";    // わる数のけた数
  var MODEKEY = "warizan-hissan-mode";   // 商の形（わる数1けたのとき）
  var NWKEY   = "warizan-hissan-nw";     // わられる数のけた数（わる数2けたのとき）
  var REMKEY  = "warizan-hissan-rem";    // あまり
  var CARKEY  = "warizan-hissan-carry";  // くり上がりを書くか

  var STEPNAMES = ["たてる","かける","ひく","おろす"];
  var ERRKEYS   = ["たてる","かける","ひく","おろす","立てる位","0を立てる"];
  var KETA      = ["一の位","十の位","百の位","千の位"];

  var DIVS  = [{id:"d1",label:"1けた"},{id:"d2",label:"2けた"}];
  var KINDS = [{id:"two",label:"商2けた"},{id:"one",label:"商1けた"},
               {id:"zero",label:"商に0"},{id:"mix",label:"まぜる"}];
  var NWS   = [{id:"round",label:"何十でわる"},{id:"n2",label:"2けた"},
               {id:"n3",label:"3けた"},{id:"mix",label:"まぜる"}];
  var REMS  = [{id:"none",label:"あまりなし"},{id:"some",label:"あまりあり"},{id:"mix",label:"まぜる"}];
  var CARRIES = [{id:"on",label:"書く"},{id:"off",label:"書かない"}];

  /* ---------- きろく ---------- */
  function blank(){
    var e={};
    ERRKEYS.forEach(function(k){ e[k]=0; });
    return {solved:0, perfect:0, streak:0, best:0, errors:e};
  }
  var rec = blank();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var pv = JSON.parse(raw);
      if(pv && typeof pv === "object"){
        rec.solved = pv.solved|0; rec.perfect = pv.perfect|0;
        rec.streak = pv.streak|0; rec.best = pv.best|0;
        if(pv.errors) for(var k in rec.errors) rec.errors[k] = pv.errors[k]|0;
      }
    }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(rec)); }catch(e){} }

  /* ---------- せってい ---------- */
  var divMode="d1", kindMode="two", nwMode="n2", remMode="none", carryMode="on";
  function has(list,id){ return list.some(function(x){ return x.id===id; }); }
  (function load(){
    try{
      var a=localStorage.getItem(DIVKEY);  if(a && has(DIVS,a))  divMode=a;
      var b=localStorage.getItem(MODEKEY); if(b && has(KINDS,b)) kindMode=b;
      var c=localStorage.getItem(NWKEY);   if(c && has(NWS,c))   nwMode=c;
      var d=localStorage.getItem(REMKEY);  if(d && has(REMS,d))  remMode=d;
      var e2=localStorage.getItem(CARKEY); if(e2 && has(CARRIES,e2)) carryMode=e2;
    }catch(e){}
  })();
  function saveSet(){
    try{
      localStorage.setItem(DIVKEY,divMode);
      localStorage.setItem(MODEKEY,kindMode);
      localStorage.setItem(NWKEY,nwMode);
      localStorage.setItem(REMKEY,remMode);
      localStorage.setItem(CARKEY,carryMode);
    }catch(e){}
  }

  /* ---------- わる数1けた：720通りを仕分けて持っておく ---------- */
  var POOLS1 = (function(){
    var P = {two:{none:[],some:[]}, one:{none:[],some:[]}, zero:{none:[],some:[]}};
    for(var v=2; v<=9; v++){
      for(var n=10; n<=99; n++){
        var d0=Math.floor(n/10), d1=n%10, bin=(n%v===0)?"none":"some";
        if(d0 >= v){
          var q0=Math.floor(d0/v), s1=d0-q0*v, q1=Math.floor((s1*10+d1)/v);
          P[q1===0 ? "zero" : "two"][bin].push([n,v]);
        }else{
          P.one[bin].push([n,v]);
        }
      }
    }
    return P;
  })();

  /* ---------- わる数2けた：数が多いので、その場で作る ---------- */
  // 何十でわる / わられる数2けた / わられる数3けた
  function d2Spec(id){
    if(id === "round") return {lo:10,  hi:999, only10:true};
    if(id === "n2")    return {lo:10,  hi:99,  only10:false};
    return                    {lo:100, hi:999, only10:false};
  }
  // 商が1にしかならない問題（98÷73 など）は練習にならないので出さない
  function d2Count(v, sp, rem){
    var start = Math.max(sp.lo, 2*v);
    if(start > sp.hi) return 0;
    var mult = Math.floor(sp.hi/v) - Math.ceil(start/v) + 1;
    if(mult < 0) mult = 0;
    return (rem === "none") ? mult : (sp.hi - start + 1) - mult;
  }
  function d2Vs(sp, rem){
    var vs = [];
    for(var v=10; v<=99; v++){
      if(sp.only10 && v % 10 !== 0) continue;
      if(d2Count(v, sp, rem) > 0) vs.push(v);
    }
    return vs;
  }
  function d2Pick(nwSel, rem){
    var sp = d2Spec(nwSel), vs = d2Vs(sp, rem);
    var vv = vs[Math.floor(Math.random()*vs.length)];
    var start = Math.max(sp.lo, 2*vv), n;
    if(rem === "none"){
      var qmin = Math.ceil(start/vv), qmax = Math.floor(sp.hi/vv);
      n = (qmin + Math.floor(Math.random()*(qmax-qmin+1))) * vv;
    }else{
      var t = 0;
      do{ n = start + Math.floor(Math.random()*(sp.hi-start+1)); t++; }
      while(n % vv === 0 && t < 300);
      if(n % vv === 0) n = (n + 1 <= sp.hi) ? n + 1 : n - 1;
    }
    return [n, vv];
  }

  function kindIds(){ return kindMode==="mix" ? ["two","one","zero"] : [kindMode]; }
  function nwIds(){   return nwMode==="mix"   ? ["round","n2","n3"]  : [nwMode]; }
  function remIds(){  return remMode==="mix"  ? ["none","some"]      : [remMode]; }
  function askPlace(){
    return divMode==="d2" ? true : (kindMode==="one" || kindMode==="mix");
  }
  function poolCount(){
    var c = 0;
    if(divMode === "d1"){
      kindIds().forEach(function(k){ remIds().forEach(function(r){ c += POOLS1[k][r].length; }); });
    }else{
      nwIds().forEach(function(x){
        var sp = d2Spec(x);
        remIds().forEach(function(rm){
          for(var v=10; v<=99; v++){
            if(sp.only10 && v % 10 !== 0) continue;
            c += d2Count(v, sp, rm);
          }
        });
      });
    }
    return c;
  }
  function setLabel(){
    var rl = {none:"あまりなし", some:"あまりあり", mix:"あまりまぜる"}[remMode];
    if(divMode === "d1"){
      if(kindMode==="mix" && remMode==="mix") return "ぜんぶまぜる";
      return {two:"商2けた", one:"商1けた", zero:"商に0", mix:"商まぜる"}[kindMode] + "・" + rl;
    }
    if(nwMode==="mix" && remMode==="mix") return "わる数2けた・ぜんぶまぜる";
    return "わる数2けた・" + {round:"何十でわる", n2:"わられる数2けた",
                              n3:"わられる数3けた", mix:"形まぜる"}[nwMode] + "・" + rl;
  }

  /* ---------- もんだいを組み立てる（けた数によらない） ---------- */
  function ketaName(col, nw){ return KETA[nw - 1 - col] || ""; }

  // くり下がりの ことば（answer=true なら 計算の形まで見せる）
  function subWords(info, answer){
    if(info.aEff < 0){
      return "この位は 0 だから くり下げられないね。もう1つ上の位からくり下げて、9 − " + info.b
           + (answer ? " だよ" : "");
    }
    var pre = info.borrowedIn
      ? ("下の位に 1 くり下げたから、" + info.a + " ではなく " + info.aEff + " からひくよ。")
      : "";
    if(info.needBorrow){
      return pre + info.aEff + " から " + info.b + " はひけないね。上の位から 1 くり下げて"
           + (answer ? ("、" + (info.aEff + 10) + " − " + info.b) : "");
    }
    return pre + (answer ? (info.aEff + " − " + info.b + " は？") : "もう一度 数えてみよう");
  }

  function buildProblem(n, v, wantPlace){
    var D  = String(n).split("").map(Number);
    var nw = D.length, dw = String(v).length;

    // 最初にわる部分（先頭dwけた。それでも小さければ dw+1 けた）
    var s = dw;
    if(Number(D.slice(0,dw).join("")) < v) s = dw + 1;
    var qw = nw - s + 1;
    var R  = 2 + 2*qw;                       // 行数

    // 各段の計算
    var stages = [], partial = Number(D.slice(0,s).join("")), qstr = "";
    for(var i=0; i<qw; i++){
      var col  = s - 1 + i;
      var q    = Math.floor(partial / v);
      var prod = q * v;
      var diff = partial - prod;
      var bring = (i < qw-1) ? D[s+i] : null;
      stages.push({col:col, into:partial, q:q, prod:prod, diff:diff, bring:bring});
      qstr += q;
      if(bring !== null) partial = diff*10 + bring;
    }
    var qv = Number(qstr), rv = stages[qw-1].diff;

    // マスの正解（null は「空欄が正しい」）
    var exp = {}, editRows = [0];
    for(var rr=2; rr<R; rr++) editRows.push(rr);
    editRows.forEach(function(row){
      for(var j=0; j<nw; j++) exp["c"+row+"_"+j] = null;
    });
    function put(row, endCol, val){
      var str = String(val), ids = [], start = endCol - str.length + 1;
      for(var k=0; k<str.length; k++){
        var id = "c"+row+"_"+(start+k);
        exp[id] = Number(str.charAt(k));
        ids.push(id);
      }
      return ids;
    }

    var steps = [], prevDiffStart = 0, carryCells = [];
    stages.forEach(function(st, i){
      var prodRow = 2 + 2*i, diffRow = 3 + 2*i;
      var qid = "c0_" + st.col;
      exp[qid] = st.q;
      var prodIds = put(prodRow, st.col, st.prod);
      var diffIds = put(diffRow, st.col, st.diff);
      var round   = Math.round(v/10)*10;

      // ひき算を 一の位から 1けたずつ たどって、くり下がりを記録する
      var aStart = (i === 0) ? 0 : prevDiffStart;
      var width  = st.col - aStart + 1;
      var aStr = String(st.into), bStr = String(st.prod);
      while(aStr.length < width) aStr = "0" + aStr;
      while(bStr.length < width) bStr = "0" + bStr;
      var sub = {}, borrow = 0;
      for(var j = width-1; j >= 0; j--){
        var a = Number(aStr.charAt(j)), b = Number(bStr.charAt(j));
        var aEff = a - borrow;                 // 下の位にくり下げたあとの この位の数
        var need = (aEff < b) ? 1 : 0;         // 上の位から くり下げるか
        sub[aStart + j] = {a:a, b:b, aEff:aEff, borrowedIn:borrow, needBorrow:need,
                           c:(need ? aEff + 10 : aEff) - b};
        borrow = need;
      }
      prevDiffStart = st.col - String(st.diff).length + 1;

      steps.push({k:"たてる", stage:i, cells:[qid], into:st.into, col:st.col,
        guide:"" + ketaName(st.col, nw) + "に商をたてよう",
        hint: (st.q === 0)
                ? (st.into + " は " + v + " でわれないね。こんなときは 0 を立てるよ")
                : (dw === 1
                    ? (st.into + " ÷ " + v + " は いくつ？（あまりは 気にしない）")
                    : (v + " を およそ " + round + " とみて、" + st.into + " ÷ " + round
                       + " で見当をつけよう。合わなければ 1つずつ直すよ"))});

      // かけ算：わる数が2けた以上なら 一の位から。くり上がりも書く
      var kcells = prodIds, kinfo = {};
      // 商が0の段は 積が「0」1けただけなので、けたごとの組み立ては要らない
      if(dw >= 2 && st.q > 0){
        var Vd = String(v).split("").map(Number);
        var cs = [], cr = 0;
        for(var k2 = dw-1; k2 >= 0; k2--){
          var tt = Vd[k2]*st.q + cr;
          cr = Math.floor(tt/10);
          if(k2 > 0) cs[k2-1] = cr;      // Vd[k2-1] の右肩に書くくり上がり
        }
        var lead = cr, rev = prodIds.slice().reverse();
        kcells = [];
        for(var m = 0; m < dw; m++){
          var ki = dw-1-m;
          var cin = (ki === dw-1) ? 0 : cs[ki];
          kinfo[rev[m]] = {kind:"digit", d:Vd[ki], q:st.q, carryIn:cin, t:Vd[ki]*st.q + cin};
          kcells.push(rev[m]);
          if(ki > 0 && cs[ki-1] > 0 && carryMode === "on"){
            var cid = "k" + i + "_" + (ki-1);
            exp[cid] = cs[ki-1];
            // くり上がりは、それを足しこむ「積のけた」の右肩に置く
            // 54×9 なら 4×9=36 の 3 を、積 486 の十の位（8）の右肩に
            carryCells.push({id:cid, stage:i, host:"c" + prodRow + "_" + (st.col - dw + ki)});
            kinfo[cid] = {kind:"carry", d:Vd[ki], q:st.q, t:Vd[ki]*st.q + cin, val:cs[ki-1]};
            kcells.push(cid);
          }
        }
        if(lead > 0) kcells.push(rev[dw]);
      }
      steps.push({k:"かける", stage:i, cells:kcells, kinfo:kinfo,
        guide:"たてた商と、わる数をかけよう" + (dw >= 2 ? "。一の位から" : ""),
        hint: st.q + " × " + v + " は？",
        hintFor: (dw < 2) ? null : function(cellId){
          var f = kinfo[cellId];
          if(!f) return st.q + " × " + v + " は？";
          if(f.kind === "carry") return f.t + " の十の位 " + f.val + " を、右肩に小さく書こう";
          return f.carryIn
            ? (f.d + " × " + f.q + " に くり上がりの " + f.carryIn + " をたして " + f.t + "。その一の位を書くよ")
            : (f.d + " × " + f.q + " は？ その一の位を書くよ");
        }});

      steps.push({k:"ひく", stage:i, cells:diffIds.slice().reverse(), last:(i === qw-1),
        into:st.into, prod:st.prod, sub:sub,
        guide: (diffIds.length > 1 ? "一の位からじゅんに、上の数からひこう" : "上の数から、かけた数をひこう")
               + ((i === qw-1 && st.diff > 0) ? "。のこりがあまり" : ""),
        hint: st.into + " − " + st.prod + " は？"
              + (i === qw-1 ? (st.diff === 0 ? "（0 になるよ）" : "（のこりが あまり）") : ""),
        hintFor: function(cellId){
          var info = sub[Number(cellId.split("_")[1])];
          if(!info) return st.into + " − " + st.prod + " は？";
          return subWords(info, true);
        }});

      if(st.bring !== null){
        exp["c"+diffRow+"_"+(st.col+1)] = st.bring;      // おろす数
        steps.push({k:"おろす", stage:i, cells:["c"+diffRow+"_"+(st.col+1)], col:st.col+1,
          guide: ketaName(st.col+1, nw) + "の数をおろそう",
          hint:  ketaName(st.col+1, nw) + "の " + st.bring + " を そのまま 下におろす"});
      }
    });

    // 商をどの位に立てるか（候補が2つあるときだけ選ばせる）
    var placeCells = [];
    [dw-1, dw].forEach(function(c){ if(c >= 0 && c < nw) placeCells.push("c0_"+c); });
    if(wantPlace && placeCells.length > 1){
      steps[0].place = true;
      steps[0].guide = "商を立てる位をえらんでタップしよう";
    }

    return {n:n, v:v, q:qv, r:rv, D:D, nw:nw, dw:dw, qw:qw, rows:R, s:s,
            stages:stages, exp:exp, steps:steps, placeCells:placeCells, carryCells:carryCells,
            filled:{}, si:0, ci:0, sel:null, mistakes:0, done:false, doneStages:0};
  }

  /* ---------- 出題 ---------- */
  var lastN=-1, lastKind="", lastNw="", lastRem="";
  function pickCat(setting, opts, last){
    if(setting !== "mix") return setting;
    var c = opts[Math.floor(Math.random()*opts.length)];
    if(c === last && Math.random() < 0.5){
      var others = opts.filter(function(o){ return o !== last; });
      c = others[Math.floor(Math.random()*others.length)];
    }
    return c;
  }

  function makeProblem(){
    var rem = pickCat(remMode, ["none","some"], lastRem);
    lastRem = rem;
    var n, v, t = 0;
    if(divMode === "d1"){
      var kind = pickCat(kindMode, ["two","one","zero"], lastKind);
      lastKind = kind;
      var pool = POOLS1[kind][rem], pick;
      do{ pick = pool[Math.floor(Math.random()*pool.length)]; t++; }
      while(pool.length > 1 && pick[0] === lastN && t < 40);
      n = pick[0]; v = pick[1];
    }else{
      var nwSel = pickCat(nwMode, ["round","n2","n3"], lastNw);
      lastNw = nwSel;
      var p2;
      do{ p2 = d2Pick(nwSel, rem); t++; } while(p2[0] === lastN && t < 40);
      n = p2[0]; v = p2[1];
    }
    lastN = n;
    return buildProblem(n, v, askPlace());
  }

  var P = makeProblem();

  /* ---------- 筆算を組み立てる ---------- */
  var hissan = document.getElementById("hissan");
  var cellEl = {}, ruleEls = [], noteEl = null;

  function buildBoard(){
    hissan.innerHTML = "";
    cellEl = {}; ruleEls = [];

    var cols = P.dw + P.nw;
    hissan.style.setProperty("--cols", cols);
    hissan.style.gridTemplateColumns = "repeat(" + cols + ", var(--cw))";
    hissan.style.gridTemplateRows    = "repeat(" + P.rows + ", var(--ch))";

    function make(gRow, gCol, cls, text, id){
      var d = document.createElement("div");
      d.className = "cell " + (cls||"");
      d.style.gridRow = gRow;
      d.style.gridColumn = gCol;
      var sp = document.createElement("span");
      sp.className = "val";
      sp.textContent = (text == null ? "" : text);
      d.appendChild(sp);
      if(id){
        cellEl[id] = d;
        if(id.indexOf("c0_") === 0){
          d.setAttribute("role","button");
          d.addEventListener("click", function(){ selectCell(id); });
        }
      }
      hissan.appendChild(d);
      return d;
    }

    // わる数（左側）
    var vs = String(P.v);
    for(var a=0; a<P.dw; a++) make(2, 1+a, "given", vs.charAt(a));

    // わられる数（かっこの中）
    for(var j=0; j<P.nw; j++){
      make(2, P.dw+1+j, "given " + (j===0 ? "dvd-l" : "dvd-r"), P.D[j]);
    }

    // 書きこむマス
    var editRows = [0];
    for(var rr=2; rr<P.rows; rr++) editRows.push(rr);
    editRows.forEach(function(row){
      for(var j2=0; j2<P.nw; j2++){
        make(row+1, P.dw+1+j2, "slot", "", "c"+row+"_"+j2);
      }
    });

    // くり上がりを書く小さいマス（積のそのけたの右肩）
    P.carryCells.forEach(function(cc){
      var hostEl = cellEl[cc.host];
      if(!hostEl) return;
      var box = document.createElement("div");
      box.className = "carrybox";
      var sp2 = document.createElement("span");
      sp2.className = "val"; sp2.textContent = "";
      box.appendChild(sp2);
      hostEl.appendChild(box);
      cellEl[cc.id] = box;
    });

    // ひき算の線（段ごとに、その段の計算はばだけ）
    P.stages.forEach(function(st, i){
      var el = document.createElement("div");
      el.className = "rule";
      el.style.gridRow = 3 + 2*i;
      el.style.gridColumn = (P.dw+1) + " / " + (P.dw + 2 + st.col);
      hissan.appendChild(el);
      ruleEls.push(el);
    });

    // 「あまり」のふだ
    noteEl = document.createElement("div");
    noteEl.className = "note hidden";
    noteEl.style.gridRow = P.rows;
    noteEl.style.gridColumn = "1 / span " + P.dw;
    noteEl.textContent = "あまり";
    hissan.appendChild(noteEl);
  }

  /* ---------- 画面 ---------- */
  var setBtn  = document.getElementById("setBtn");
  var setLbl  = document.getElementById("setLabel");
  var chipsEl = document.getElementById("chips");
  var whereEl = document.getElementById("where");
  var guideEl = document.getElementById("guide");
  var subEl   = document.getElementById("sub");
  var countEl = document.getElementById("count");
  var padEl   = document.getElementById("pad");
  var nextBtn = document.getElementById("nextBtn");
  var maruEl  = document.getElementById("maru");

  function render(keepSub){
    var step    = P.done ? null : P.steps[P.si];
    var isPlace = !!(step && step.place);
    var act     = P.done ? null : (isPlace ? P.sel : step.cells[P.ci]);

    setLbl.textContent = setLabel();

    chipsEl.innerHTML = "";
    STEPNAMES.forEach(function(name){
      var c = document.createElement("div");
      c.className = "chip";
      if(step && step.k === name) c.className += " now";
      c.textContent = name;
      chipsEl.appendChild(c);
    });

    whereEl.textContent = P.done ? "できあがり"
      : (isPlace ? "商はどの位に立つ？"
                 : (ketaName(P.stages[step.stage].col, P.nw) + "の計算"));

    for(var id in cellEl){
      var el = cellEl[id];
      var vv = P.filled[id];
      el.querySelector(".val").textContent = (vv == null ? "" : vv);
      el.classList.remove("active","pending","choose");
      if(P.done || !step) continue;
      if(isPlace){
        if(P.placeCells.indexOf(id) >= 0){
          el.classList.add(id === P.sel ? "active" : "choose");
        }
      }else{
        if(id === act) el.classList.add("active");
        else if(step.cells.indexOf(id) >= 0) el.classList.add("pending");
      }
    }

    // ひき算の線は、その段のかけ算が終わったら出す
    ruleEls.forEach(function(el, i){
      el.classList.toggle("show", P.doneStages > i || P.done);
    });

    noteEl.classList.toggle("hidden", !(P.done && P.r > 0));

    if(P.done){
      guideEl.textContent = P.mistakes === 0 ? "せいかい！ ノーミス！" : "せいかい！";
      subEl.className = "sub";
      subEl.textContent = P.n + " ÷ " + P.v + " = " + P.q
        + (P.r > 0 ? " あまり " + P.r : "")
        + (P.mistakes === 0 ? "" : "（まちがい " + P.mistakes + "回）");
    }else{
      guideEl.textContent = (isPlace ? "たてる：" : step.k + "：") + step.guide;
      if(!keepSub){ subEl.className = "sub"; subEl.textContent = ""; }
    }

    padEl.classList.toggle("hidden", P.done);
    nextBtn.classList.toggle("hidden", !P.done);
    countEl.textContent = "といた数 " + rec.solved + "　花丸 " + rec.perfect
                        + "　連続 " + rec.streak;
  }

  function say(cls, text){ subEl.className = "sub " + cls; subEl.textContent = text; }

  function selectCell(id){
    if(P.done) return;
    if(!P.steps[P.si].place) return;
    if(P.placeCells.indexOf(id) < 0) return;
    P.sel = id;
    render();
  }

  /* ---------- まちがいの ことば ---------- */
  function wrongText(step, target, dig, placeErr){
    if(placeErr){
      var head = Number(String(P.n).slice(0, P.dw));
      var rightCol = Number(step.cells[0].split("_")[1]);
      if(P.dw === 1){
        return (rightCol > 0)
          ? "十の位の " + head + " は " + P.v + " より小さいね。十の位に商は立たないよ"
          : "十の位の " + head + " は " + P.v + " でわれるよ。商は十の位から立つね";
      }
      return (rightCol > P.dw - 1)
        ? "はじめの " + P.dw + "けた " + head + " は " + P.v + " より小さいね。そこには商が立たないよ"
        : "はじめの " + P.dw + "けた " + head + " は " + P.v + " でわれるよ。商はそこから立つね";
    }
    if(step.k === "たてる"){
      var want = P.exp[target];
      if(want === 0) return step.into + " は " + P.v + " でわれないね。わられないときは 0 を立てるよ";
      return (dig > want)
        ? "大きすぎるよ。" + dig + " × " + P.v + " = " + (dig*P.v) + " で、"
          + step.into + " より大きいね。1つ小さくしてみよう"
        : "小さすぎるよ。ひいたあとが まだ " + P.v + " でわれてしまうね。1つ大きくしてみよう";
    }
    if(step.k === "かける" && step.kinfo){
      var kf = step.kinfo[target];
      if(kf){
        if(kf.kind === "carry") return "くり上がりは " + kf.t + " の十の位だよ";
        if(kf.carryIn && dig === (kf.d * kf.q) % 10){
          return "くり上がりの " + kf.carryIn + " を たし忘れていないかな？";
        }
      }
    }
    if(step.k === "ひく"){
      var info = step.sub && step.sub[Number(target.split("_")[1])];
      if(info){
        // くり下げたことを忘れている、いちばん多いまちがい
        if(info.borrowedIn && info.a >= info.b && dig === info.a - info.b){
          return "下の位に 1 くり下げたね。" + info.a + " ではなく " + info.aEff + " からひくよ";
        }
        if(info.needBorrow || info.aEff < 0) return subWords(info, false);
      }
      if(P.v <= 9 && dig >= P.v){
        return (step.last ? "あまりは " : "ひいたあとは ")
             + "わる数の " + P.v + " より小さくなるはずだよ";
      }
    }
    return "おしい！ もう一度 " + step.k + "を やってみよう";
  }

  /* ---------- 入力 ---------- */
  function press(dig){
    if(P.done) return;
    var step = P.steps[P.si];
    var target, placeErr = false;

    if(step.place){
      if(!P.sel){ say("warn", "まず、商を書くマスをタップしてね"); return; }
      target = P.sel;
      if(target !== step.cells[0]) placeErr = true;
    }else{
      target = step.cells[P.ci];
    }
    var el = cellEl[target];

    if(!placeErr && P.exp[target] === dig){
      P.filled[target] = dig;
      el.classList.remove("wrong");
      el.classList.add("just");
      setTimeout(function(){ el.classList.remove("just"); }, 320);
      P.ci++;
      if(P.ci >= step.cells.length){
        P.ci = 0; P.si++; P.sel = null;
        if(step.k === "かける") P.doneStages++;
        if(P.si >= P.steps.length) finish();
      }
      render();
      return;
    }

    P.mistakes++;
    var ekey = placeErr ? "立てる位"
             : (step.k === "たてる" && P.exp[target] === 0) ? "0を立てる"
             : step.k;
    rec.errors[ekey] = (rec.errors[ekey]|0) + 1;
    save();

    el.querySelector(".val").textContent = dig;
    el.classList.add("wrong");
    say("warn", wrongText(step, target, dig, placeErr));
    if(placeErr) P.sel = null;

    setTimeout(function(){ el.classList.remove("wrong"); render(true); }, 700);
  }

  function showHint(){
    if(P.done) return;
    var step = P.steps[P.si];
    var h = step.hintFor ? step.hintFor(step.cells[P.ci]) : step.hint;
    say("hint", "ヒント：" + h);
  }

  function retry(){
    P.filled = {}; P.si = 0; P.ci = 0; P.sel = null;
    P.mistakes = 0; P.done = false; P.doneStages = 0;
    maruEl.classList.add("hidden");
    render();
  }

  /* ---------- 花丸 ---------- */
  function flowerPath(cx, cy, r, petals){
    var d = "", R = r*1.28;
    for(var i=0;i<petals;i++){
      var a0=(i/petals)*Math.PI*2 - Math.PI/2, a1=((i+1)/petals)*Math.PI*2 - Math.PI/2;
      var ca=a0+(a1-a0)*0.28, cb=a0+(a1-a0)*0.72;
      var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      var x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      var xa=cx+R*Math.cos(ca), ya=cy+R*Math.sin(ca);
      var xb=cx+R*Math.cos(cb), yb=cy+R*Math.sin(cb);
      if(i===0) d += "M"+x0.toFixed(1)+" "+y0.toFixed(1);
      d += "C"+xa.toFixed(1)+" "+ya.toFixed(1)+" "+xb.toFixed(1)+" "+yb.toFixed(1)
         + " "+x1.toFixed(1)+" "+y1.toFixed(1);
    }
    return d + "Z";
  }
  function drawMaru(perfect){
    var d = perfect ? flowerPath(100,100,74,9) : "M100 26 A74 74 0 1 1 99.9 26 Z";
    maruEl.innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true"><path d="'+d+'"></path></svg>';
    maruEl.classList.remove("hidden");
    var path = maruEl.querySelector("path");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!reduce && path.getTotalLength){
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      path.animate([{strokeDashoffset:len},{strokeDashoffset:0}],
        {duration:750, easing:"cubic-bezier(.3,.7,.3,1)", fill:"forwards"});
    }
  }
  function finish(){
    P.done = true;
    rec.solved++;
    if(P.mistakes === 0){
      rec.perfect++; rec.streak++;
      if(rec.streak > rec.best) rec.best = rec.streak;
    }else{ rec.streak = 0; }
    save();
    drawMaru(P.mistakes === 0);
  }

  /* ---------- シート ---------- */
  function openSheet(html, label, mount, opener){
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML = '<div class="sheet-in" role="dialog" aria-modal="true" aria-label="'
                    + label + '">' + html + '</div>';
    document.body.appendChild(sheet);
    function close(){ sheet.remove(); if(opener) opener.focus(); }
    sheet.addEventListener("click", function(e){ if(e.target === sheet) close(); });
    var c = sheet.querySelector("#closeSheet");
    if(c){ c.addEventListener("click", close); c.focus(); }
    if(mount) mount(sheet, close);
    return sheet;
  }
  function segHTML(id, items, cur){
    return '<div class="segs" id="'+id+'">' + items.map(function(it){
      return '<button class="mode" type="button" data-id="'+it.id+'" aria-pressed="'
           + (it.id===cur) + '">' + it.label + '</button>';
    }).join("") + '</div>';
  }

  setBtn.addEventListener("click", function(){
    var html = '<h2>もんだいの種類</h2>'
      + '<h3>わる数のけた数</h3>' + segHTML("segDiv", DIVS, divMode)
      + '<div id="subAxis"></div>'
      + '<h3>あまり</h3>' + segHTML("segRem", REMS, remMode)
      + '<div id="carryAxis"></div>'
      + '<p class="empty" id="poolInfo"></p>'
      + '<div class="sheet-actions"><button class="sheet-close" id="closeSheet">とじる</button></div>';

    openSheet(html, "もんだいの種類", function(sheet){
      var info = sheet.querySelector("#poolInfo");
      var subAxis = sheet.querySelector("#subAxis");
      var carryAxis = sheet.querySelector("#carryAxis");

      function bind(gid, onPick){
        sheet.querySelectorAll("#"+gid+" .mode").forEach(function(b){
          b.addEventListener("click", function(){
            onPick(b.getAttribute("data-id"));
            saveSet(); refresh(); nextProblem();
          });
        });
      }
      function refresh(){
        // まん中の軸は、わる数のけた数で意味が変わる
        subAxis.innerHTML = (divMode === "d1")
          ? '<h3>商の形</h3>' + segHTML("segKind", KINDS, kindMode)
          : '<h3>もんだいの形</h3>' + segHTML("segNw", NWS, nwMode);
        if(divMode === "d1") bind("segKind", function(id){ kindMode = id; });
        else                 bind("segNw",   function(id){ nwMode = id; });

        // くり上がりの書きこみは わる数2けたのときだけ意味がある
        carryAxis.innerHTML = (divMode === "d2")
          ? '<h3>くり上がりの書きこみ</h3>' + segHTML("segCar", CARRIES, carryMode)
          : "";
        if(divMode === "d2") bind("segCar", function(id){ carryMode = id; });

        ["segDiv","segRem"].forEach(function(gid){
          var cur = (gid==="segDiv") ? divMode : remMode;
          sheet.querySelectorAll("#"+gid+" .mode").forEach(function(b){
            b.setAttribute("aria-pressed", String(b.getAttribute("data-id") === cur));
          });
        });

        info.textContent = "いま出るのは " + poolCount().toLocaleString() + " 通り。"
          + (divMode === "d2"
              ? "わる数を何十とみて見当をつけ、合わなければ1つずつ直します。"
              : (askPlace() ? "商を立てる位は、子どもがえらびます。"
                            : "商は必ず十の位から立つので、書く位置はアプリが決めます。"));
      }
      bind("segDiv", function(id){ divMode = id; });
      bind("segRem", function(id){ remMode = id; });
      refresh();
    }, setBtn);
  });

  var recBtn = document.getElementById("recBtn");
  recBtn.addEventListener("click", function(){
    var total = 0;
    ERRKEYS.forEach(function(k){ total += (rec.errors[k]|0); });
    var bars = ERRKEYS.map(function(k){
      var n = rec.errors[k]|0, w = total ? Math.round(n/total*100) : 0;
      return '<div class="bar-row"><span>'+k+'</span>'
           + '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'
           + '<span class="bar-num">'+n+'</span></div>';
    }).join("");
    var html = '<h2>きろく</h2>'
      + '<div class="stat-row">'
      +   '<div class="stat"><b>'+rec.solved +'</b><span>といた数</span></div>'
      +   '<div class="stat"><b>'+rec.perfect+'</b><span>花丸</span></div>'
      +   '<div class="stat"><b>'+rec.best   +'</b><span>連続さいこう</span></div>'
      + '</div>'
      + '<h3>つまずいた工程</h3>'
      + (total ? '<div class="bars">'+bars+'</div>'
               : '<p class="empty">まだ まちがいは ありません。</p>')
      + '<div class="sheet-actions">'
      +   '<button class="sheet-close" id="closeSheet">とじる</button>'
      +   '<button class="linkbtn danger" id="resetRec">きろくを消す</button>'
      + '</div>';
    openSheet(html, "きろく", function(sheet, close){
      sheet.querySelector("#resetRec").addEventListener("click", function(){
        if(confirm("きろくを すべて 消しますか？")){ rec = blank(); save(); close(); render(); }
      });
    }, recBtn);
  });

  /* ---------- テンキー ---------- */
  function buildPad(){
    padEl.innerHTML = "";
    [1,2,3,4,5,6,7,8,9].forEach(function(d){
      var b = document.createElement("button");
      b.className="key"; b.type="button"; b.textContent=d;
      b.addEventListener("click", function(){ press(d); });
      padEl.appendChild(b);
    });
    var h = document.createElement("button");
    h.className="key util"; h.type="button"; h.textContent="ヒント";
    h.addEventListener("click", showHint); padEl.appendChild(h);
    var z = document.createElement("button");
    z.className="key"; z.type="button"; z.textContent="0";
    z.addEventListener("click", function(){ press(0); }); padEl.appendChild(z);
    var r = document.createElement("button");
    r.className="key util"; r.type="button"; r.textContent="やりなおす";
    r.addEventListener("click", retry); padEl.appendChild(r);
  }

  document.addEventListener("keydown", function(e){
    if(document.querySelector(".sheet")) return;
    if(e.key >= "0" && e.key <= "9"){ press(parseInt(e.key,10)); }
    else if(e.key === "Enter" && P.done){ nextProblem(); }
    else if(!P.done && P.steps[P.si].place){
      var i = P.placeCells.indexOf(P.sel);
      if(e.key === "ArrowLeft"){  selectCell(P.placeCells[Math.max(0, (i<0?1:i)-1)]); e.preventDefault(); }
      else if(e.key === "ArrowRight"){ selectCell(P.placeCells[Math.min(P.placeCells.length-1, i+1)]); e.preventDefault(); }
    }
  });

  function nextProblem(){
    P = makeProblem();
    maruEl.classList.add("hidden");
    buildBoard();
    render();
  }
  nextBtn.addEventListener("click", nextProblem);

  buildBoard();
  buildPad();
  render();
})();
</script>
